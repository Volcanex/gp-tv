# GabeTV retroarch overrides. Applied with --appendconfig, which retroarch
# reads AFTER the main config and never writes back, so these survive the
# config rewrite retroarch does on every exit.

# Threaded video races the KMS mode set when uxplay is handing the display
# back, and retroarch bails with "Cannot open threaded video driver".
# Unthreaded is also slightly cheaper on this chip.
video_threaded = "false"
video_driver = "gl"
video_context_driver = "kms"
video_vsync = "true"

# Game audio goes out the 3.5mm jack to the speaker, not the tv. Named card
# rather than hw:0 so it survives renumbering, and plug so alsa converts.
# Airplay is untouched and still goes to the tv over hdmi.
# alsathread, 2026-09-23: on a late frame it pads with silence instead of
# letting alsa underrun and restart the stream (the audible cut). Lakka default.
audio_driver = "alsathread"
audio_device = "plughw:CARD=Headphones,DEV=0"

# The PS button on its own quits back to the GabeTV menu. Added 2026-09-22
# because there was no way off a game from the sofa.
#
# This means dropping the hotkey modifier entirely, and with no modifier a bare
# select would open retroarch's own menu and a bare L1 would clobber a save
# state mid-game. So those are unbound. The TUI is the menu, nothing is lost.
input_enable_hotkey_btn = "nul"
input_exit_emulator_btn = "10"
input_menu_toggle_btn = "nul"
input_save_state_btn = "nul"
input_load_state_btn = "nul"

# Input latency, added 2026-09-22. Two buffers rather than three is the usual
# win on KMS: the default swapchain holds an extra frame, which at 60Hz is
# another ~16ms between pressing a button and seeing it. Audio buffer: 64ms
# underran (crackle) in 5 of 47s of NES on 2026-09-23, so back to 96. Audio
# buffer length delays the sound only, not the picture or your input.
# Deliberately NOT using hard sync or run-ahead: both buy latency with cpu, and
# cpu is exactly what this board cannot spare while it is browning out.
video_max_swapchain_images = "2"
audio_latency = "96"

# Refresh rate, 2026-09-23: measured from kernel page-flip timestamps, 1200
# flips over 20s. The tv really runs at 59.994Hz, not 60. Retroarch uses this
# number to steer audio resampling, so the true value keeps the audio buffer
# from slowly draining or overfilling.
video_refresh_rate = "59.994"

# Remaps are managed as files (stick-to-dpad, triangle-run). Without this,
# retroarch writes its in-memory remap back on exit and can undo edits.
remap_save_on_exit = "false"
