# G-System default audio -> HDMI (TV).
# Install to /etc/asound.conf. Fixes "no sound on the TV": the Pi's stock
# default ALSA card is the 3.5mm headphone jack (card 0), so mpv/UI audio went
# there instead of out HDMI. Routing the default to the vc4hdmi card sends all
# audio to the TV. `type plug` handles stereo/format conversion (downmixes 5.1).
pcm.!default {
    type plug
    slave.pcm { type hw; card vc4hdmi }
}
ctl.!default {
    type hw
    card vc4hdmi
}
