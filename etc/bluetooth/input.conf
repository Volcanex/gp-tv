[General]
# A PlayStation 3 DualShock cannot do standard bluetooth bonding: it is paired
# by writing the host MAC into the pad over USB (the "sixpair" step) and then
# simply connects. BlueZ 5.x defaults ClassicBondedOnly=true, which refuses HID
# from any device that is not bonded, so the pad connects at ACL level but no
# input device is ever created. Allowing unbonded HID is what makes DS3 work.
# Added 2026-09-21. Undo: restore input.conf.bak, restart bluetooth.
ClassicBondedOnly=false
UserspaceHID=true

# Disconnect a controller after 10 minutes with no input, so a pad left on the
# sofa stops draining. It wakes again on the PS button. Added 2026-09-22.
IdleTimeout=10
