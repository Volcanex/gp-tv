// Configured 2026-09-20 for the flat media build.
general = {
    name = "GabeSound";
    output_backend = "alsa";
    volume_range_db = 60;
};

alsa = {
    output_device = "hw:0";   // card 0 = bcm2835 3.5mm jack. Use "hw:3" for HDMI.
    mixer_control_name = "Headphone";
};

sessioncontrol = {
    allow_session_interruption = "yes";
};
