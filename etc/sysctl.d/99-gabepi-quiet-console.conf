# Keep kernel messages off the HDMI console. The tv is a display, not a log.
# 1 = only KERN_EMERG reaches the console. Everything still goes to the
# journal, so nothing is lost: use journalctl -k to read it.
# Added 2026-09-22 because "Undervoltage detected!" was printing over the tv.
kernel.printk = 1 4 1 3
